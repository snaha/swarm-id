# Only GitHub Actions get version updates, to keep the SHA pins current; one
# grouped PR a month. npm packages get no version-bump PRs: security updates
# (enabled in the repository settings) cover them, for direct and transitive
# dependencies alike. The cooldown keeps a release pulled within days (bee-js
# 13.3.0 lived 76 minutes) from ever reaching a PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
