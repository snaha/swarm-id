# Version bumps wait out a cooldown, so a release that is pulled within days
# (bee-js 13.3.0 lived 76 minutes) never reaches a PR. Security updates are
# not delayed by it; they are enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm # covers the pnpm workspace and its lockfile
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
