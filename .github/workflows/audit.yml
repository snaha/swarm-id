name: Dependency audit

# `pnpm audit` over the whole lockfile, dev dependencies included: the apps
# bundle theirs, and a build tool runs beside what is published. It passes
# while every reported advisory is on the `auditConfig.ignoreGhsas` list in
# pnpm-workspace.yaml and fails on one that is not.
#
# Called by release.yml before the npm publish and by deploy-do.yml and
# deploy-main-pages.yml before a production deploy. PR previews are not gated.
# On a pull request it runs only when dependencies change, which includes the
# release PR (it bumps lib/package.json), so a blocked release is red before
# the merge that cuts its tag.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - '.github/workflows/audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No install: the audit reads the lockfile. A registry error fails the
      # job rather than passing it; re-run it.
      - run: pnpm audit
