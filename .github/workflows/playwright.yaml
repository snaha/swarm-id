name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: ./ui
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Build lib dependency
        working-directory: ./lib
        run: pnpm build

      - name: Start the local chain
        run: pnpm dev:chain:detach

      - name: Wait for the local chain
        run: |
          for _ in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://localhost:9545 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The local chain never answered on :9545 — the drive e2e suites would have skipped silently."
          pnpm -s dev:cluster logs blockchain --tail 100 || true
          exit 1

      - name: Run Playwright tests
        working-directory: ./ui
        run: pnpm test:e2e
        env:
          CHAIN_RPC_URL: http://localhost:9545

      - name: Stop the local chain
        if: always()
        run: pnpm dev:chain:stop

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
