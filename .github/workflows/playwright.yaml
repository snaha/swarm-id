name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright-tests:
    timeout-minutes: 30
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: ./ui
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Build lib dependency
        working-directory: ./lib
        run: pnpm build

      - name: Start the local chain
        run: pnpm dev:chain:detach

      - name: Wait for the local chain
        run: |
          for _ in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://localhost:9545 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The local chain never answered on :9545 — the drive e2e suites would have skipped silently."
          pnpm -s dev:cluster logs blockchain --tail 100 || true
          exit 1

      # The payment-rail suite needs somewhere to take a wallet signature, and
      # something to fill the deposit. Without both it skips, and the payment
      # screens go back to being hand-tested only.
      - name: Start the payment source chain
        run: pnpm dev:source-chain:detach

      - name: Start the local solver
        run: |
          GNOSIS_RPC_URL=http://localhost:9545 nohup pnpm dev:solver > /tmp/solver.log 2>&1 &
          for _ in $(seq 1 30); do
            if grep -q "watching for deposits" /tmp/solver.log; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The local solver never started — the payment-rail suite would time out."
          cat /tmp/solver.log || true
          exit 1

      - name: Run Playwright tests
        working-directory: ./ui
        run: pnpm test:e2e
        env:
          CHAIN_RPC_URL: http://localhost:9545

      - name: Solver log
        if: failure()
        run: cat /tmp/solver.log || true

      - name: Stop the local chains
        if: always()
        run: pnpm dev:chain:stop; pnpm dev:source-chain:stop

      - name: Upload test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
