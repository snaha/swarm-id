name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lib dependency
        working-directory: ./lib
        run: pnpm build

      # Buying a drive is a real on-chain purchase — there is no simulated
      # settlement any more — so the suites that add one need a chain. The
      # baked snapshot is committed, so this needs no network.
      - name: Start the local chain
        run: pnpm dev:chain:detach

      - name: Run Playwright tests
        working-directory: ./ui
        run: pnpm test:e2e
        env:
          CHAIN_RPC_URL: http://localhost:8545

      - name: Stop the local chain
        if: always()
        run: pnpm dev:chain:stop

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
