# The three-device partition scenarios (`ui/tests/three-devices.test.ts`) in
# real browsers against a real cluster. Minutes per run by design — the lease
# TTL, the idle yield and the beacon grace are each 30 s and the suite waits
# them out — so it does not run on every change:
#
#   - on a PR that touches the lease seams or the suite itself (advisory: not a
#     required check while #707 makes some scenarios skip on evidence),
#   - nightly on main, so a regression is dated to a day rather than found by
#     hand,
#   - before every npm publish (`release.yml` calls it once release-please has
#     cut the release; a red run stops the publish),
#   - on demand from the Actions tab.
#
# The job log carries every verdict and every skip's reason; the HTML report
# and the traces are uploaded when something fails.
name: Three Devices

on:
  pull_request:
    paths:
      - 'lib/src/sync/**'
      - 'lib/src/bus/**'
      - 'lib/src/proxy/**'
      - 'lib/src/swarm-id-proxy.ts'
      - 'lib/src/utils/batch-utilization.ts'
      - 'ui/src/lib/stores/account-bus.ts'
      - 'ui/src/lib/stores/account-delta.ts'
      - 'ui/src/lib/stores/accounts.svelte.ts'
      - 'ui/src/routes/proxy/**'
      - 'ui/tests/three-devices.test.ts'
      - 'ui/tests/global-setup-devices.ts'
      - 'ui/tests/helpers.ts'
      - 'ui/tests/worker-faucet.ts'
      - 'ui/playwright.devices.config.ts'
      - '.github/workflows/three-devices.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:

# Cancel superseded runs on the same ref.
concurrency:
  group: three-devices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-devices:
    name: Three devices on two partitions
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: ./ui
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Build lib dependency
        working-directory: ./lib
        run: pnpm build

      # The same image cache as the integration job: images only, never
      # volumes, so the chain state baked into the image is always fresh —
      # which is also what keeps the worker faucet stocked for every run.
      # Keyed on the bee-compose version, the only thing the images are built
      # from, so a lockfile touched for anything else still hits.
      - name: Resolve the cluster version
        id: bee-compose
        # Guarded: an empty version would leave the key `bee-images--v1`, which
        # every run would share and no run would notice.
        run: |
          version=$(pnpm -s dev:cluster --version)
          test -n "$version" || { echo "::error::bee-compose printed no version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Bee cluster images
        id: bee-images
        uses: actions/cache@v6
        with:
          path: /tmp/bee-images
          key: bee-images-${{ steps.bee-compose.outputs.version }}-v1

      - name: Load cached cluster images
        if: steps.bee-images.outputs.cache-hit == 'true'
        run: |
          for f in /tmp/bee-images/*.tar; do docker load -i "$f"; done
          docker images --filter 'reference=bee-compose:*'

      - name: Start Bee cluster
        if: steps.bee-images.outputs.cache-hit == 'true'
        run: pnpm dev:cluster:start

      # On a miss, `up` builds the images itself and labels the containers it
      # creates with the build digest rather than the image id it reads for an
      # image it finds — so the workers' `up` takes the queen and the chain for
      # outdated and recreates them seconds into their boot, after which the
      # cluster takes ~15 min to serve a direct upload. `--pull` builds every
      # image before either `up`, so both find theirs the way a hit does.
      - name: Build and start Bee cluster
        if: steps.bee-images.outputs.cache-hit != 'true'
        run: pnpm dev:cluster:start --pull

      - name: Save cluster images to cache
        if: steps.bee-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/bee-images
          imgs=$(docker images --filter 'reference=bee-compose:*' --format '{{.Repository}}:{{.Tag}}')
          echo "Saving images: $imgs"
          docker save $imgs -o /tmp/bee-images/cluster.tar

      # Readiness is a served direct upload, not the queen's /readiness: the
      # suite's every write is one, and a cold cluster answers them 30 s late.
      - name: Wait for the cluster to serve uploads
        run: bash .github/scripts/wait-for-cluster.sh
        env:
          CLUSTER_WAIT_MINUTES: 15

      # The identity UI, the demo and the signaling server are started by the
      # suite's own config (`webServer`), the way `pnpm dev` starts them.
      - name: Run the three-device suite
        working-directory: ./ui
        run: pnpm test:devices
        env:
          CHAIN_RPC_URL: http://localhost:9545

      - name: Dump cluster logs on failure
        if: failure()
        run: |
          docker ps -a || true
          echo "::group::blockchain logs"
          pnpm dev:cluster logs blockchain --tail 200 || true
          echo "::endgroup::"
          echo "::group::queen logs"
          pnpm dev:cluster logs queen --tail 300 || true
          echo "::endgroup::"

      - name: Stop Bee cluster
        if: always()
        run: pnpm dev:cluster stop || true

      - name: Upload report and traces
        uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: three-devices-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7
