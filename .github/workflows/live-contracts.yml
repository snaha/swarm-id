# The suite that talks to Relay's real quote API (`ui/src/lib/payment/relay.live.test.ts`)
# — the only thing that can catch our request or response mapping drifting from
# theirs, and it quotes every (chain, token) pair the payment screen offers. A
# read, no wallet, no money. Offline it skips; here it does not — an unreachable
# Relay fails this job on purpose, because that is worth knowing about. The job
# is not required, so it reports the outage without blocking a merge.
#
# Relay's side changes without any commit of ours, and a red run on a PR should
# mean the PR broke something, so it does not run on every change (#843):
#
#   - on a PR that touches what the suite exercises, or the suite itself,
#   - on every push to main,
#   - nightly on main, so a change on Relay's side is dated to a day,
#   - on demand from the Actions tab.
name: Live Contracts

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'ui/src/lib/payment/**'
      - 'ui/vitest.live.config.ts'
      - 'ui/vite.config.ts'
      # `withTimeout` and `withIdleTimeout`, which bound every quote
      - 'lib/src/utils/promise.ts'
      - '.github/workflows/live-contracts.yml'
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

# One run at a time across the whole repository: the quotes go out from shared
# runner addresses with no API key, and runs that start together get HTTP 429
# from Relay (#1049). Runs queue rather than cancel. GitHub keeps one pending
# run per group, so a newer queued run replaces an older queued one.
concurrency:
  group: live-contracts
  cancel-in-progress: false

jobs:
  live-tests:
    name: Live service contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the live contract suite
        working-directory: ./ui
        run: pnpm test:live
