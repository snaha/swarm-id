name: Deploy Main to GitHub Pages

# Publishes the latest main build of each app to GitHub Pages at the root paths:
#   https://swarm.snaha.net/id/    (identity UI)
#   https://swarm.snaha.net/demo/  (demo dApp)
#   https://swarm.snaha.net/docs/  (docs site, with a root redirect)
#
# This mirrors deploy-preview.yml, but uses root base paths (/id, /demo, /docs)
# instead of per-PR paths (/id/pr-N). It runs alongside deploy-do.yml, which
# keeps the canonical swarm-id.snaha.net / swarm-demo.snaha.net DO domains.
#
# keep_files: true ensures the per-PR preview folders are never clobbered.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'swarm-ui/**'
      - 'demo/**'
      - 'docs-site/**'
      - '.github/workflows/deploy-main-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Share the gh-pages lock with itself so concurrent main pushes serialise.
concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  # Detect which apps changed so we only rebuild what moved.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      demo: ${{ steps.changes.outputs.demo }}
      id: ${{ steps.changes.outputs.id }}
      docs: ${{ steps.changes.outputs.docs }}
      needs-lib: ${{ steps.changes.outputs.demo == 'true' || steps.changes.outputs.id == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            demo:
              - 'demo/**'
              - 'lib/**'
            id:
              - 'swarm-ui-next/**'
              - 'lib/**'
            docs:
              - 'docs-site/**'
              - 'lib/**'

  # Shared setup: build lib once (only if demo or id needs it).
  setup:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-lib == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-main
          path: |
            node_modules
            lib/dist
          retention-days: 1

  # Build the next-generation identity UI (swarm-ui-next) at /id.
  build-id:
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.id == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-main
          path: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build identity UI
        env:
          BASE_PATH: /id
          ORIGIN: https://swarm.snaha.net
          PUBLIC_APP_DOMAIN: https://swarm.snaha.net/demo
          PUBLIC_ID_DOMAIN: https://swarm.snaha.net/id
        run: pnpm --filter swarm-identity-next build

      - name: Create 404.html for SPA routing
        run: cp swarm-ui-next/build/index.html swarm-ui-next/build/404.html

      - name: Upload identity UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: id-build-main
          path: swarm-ui-next/build
          retention-days: 1

  # Build demo app at /demo.
  build-demo:
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.demo == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-main
          path: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo
        env:
          BASE_PATH: /demo
          PUBLIC_ID_DOMAIN: https://swarm.snaha.net/id
        run: pnpm --filter @swarm-id/demo build

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build-main
          path: demo/build
          retention-days: 1

  # Build docs at /docs, with a root redirect landing page.
  build-docs:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs-site
        run: pnpm astro build --base /docs/

      - name: Create root redirect
        run: |
          mkdir -p docs-site/dist-root/docs
          cp -r docs-site/dist/* docs-site/dist-root/docs/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=/docs/"></head></html>' > docs-site/dist-root/index.html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-main
          path: docs-site/dist-root
          retention-days: 1

  # Assemble all built apps and publish to GitHub Pages in a single push.
  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-id, build-demo, build-docs]
    if: |
      always() &&
      (needs.build-id.result == 'success' || needs.build-id.result == 'skipped') &&
      (needs.build-demo.result == 'success' || needs.build-demo.result == 'skipped') &&
      (needs.build-docs.result == 'success' || needs.build-docs.result == 'skipped') &&
      (needs.build-id.result == 'success' || needs.build-demo.result == 'success' || needs.build-docs.result == 'success')
    steps:
      - name: Create build directory structure
        run: mkdir -p build-root

      - name: Download identity UI artifact
        if: needs.build-id.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: id-build-main
          path: build-root/id

      - name: Download demo artifact
        if: needs.build-demo.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: demo-build-main
          path: build-root/demo

      # Docs artifact already contains docs/ plus the root redirect index.html.
      - name: Download docs artifact
        if: needs.build-docs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: docs-build-main
          path: build-root

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build-root
          cname: swarm.snaha.net
          keep_files: true
