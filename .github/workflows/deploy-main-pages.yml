name: Deploy Main to GitHub Pages

# Publishes the latest main build of each app to GitHub Pages at root paths:
#   https://swarm.snaha.net/id/           new identity UI (@swarm-id/ui)
#   https://swarm.snaha.net/id-legacy/    legacy identity UI (swarm-ui)
#   https://swarm.snaha.net/demo/         demo dApp, run against /id
#   https://swarm.snaha.net/demo-legacy/  demo dApp, run against /id-legacy
#   https://swarm.snaha.net/docs/         docs site (with a root redirect)
#
# This mirrors deploy-preview.yml, but uses root base paths instead of per-PR
# paths (/id/pr-N). It runs alongside deploy-do.yml, which keeps the canonical
# swarm-id.snaha.net / swarm-demo.snaha.net DO domains.
#
# keep_files: true ensures the per-PR preview folders are never clobbered.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'swarm-ui/**'
      - 'ui/**'
      - 'demo/**'
      - 'docs-site/**'
      - '.github/workflows/deploy-main-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Share the gh-pages lock with itself so concurrent main pushes serialise.
concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  # Detect which apps changed so we only rebuild what moved.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.changes.outputs.id }}
      id_legacy: ${{ steps.changes.outputs.id_legacy }}
      demo: ${{ steps.changes.outputs.demo }}
      docs: ${{ steps.changes.outputs.docs }}
      needs-lib: ${{ steps.changes.outputs.id_legacy == 'true' || steps.changes.outputs.demo == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            id:
              - 'ui/**'
            id_legacy:
              - 'swarm-ui/**'
              - 'lib/**'
            demo:
              - 'demo/**'
              - 'lib/**'
            docs:
              - 'docs-site/**'
              - 'lib/**'

  # Shared setup: build lib once (only if a lib-dependent app needs it).
  setup:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-lib == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-main
          path: |
            node_modules
            lib/dist
          retention-days: 1

  # Build the new identity UI (@swarm-id/ui) at /id. Has no lib dependency,
  # so it builds standalone without the shared workspace artifact.
  build-id:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.id == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build identity UI
        env:
          BASE_PATH: /id
          ORIGIN: https://swarm.snaha.net
          PUBLIC_APP_DOMAIN: https://swarm.snaha.net/demo
          PUBLIC_ID_DOMAIN: https://swarm.snaha.net/id
        run: pnpm --filter @swarm-id/ui build

      - name: Create 404.html for SPA routing
        run: cp ui/build/index.html ui/build/404.html

      - name: Upload identity UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: id-build-main
          path: ui/build
          retention-days: 1

  # Build the legacy identity UI (swarm-ui) at /id-legacy.
  build-id-legacy:
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.id_legacy == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-main
          path: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build legacy identity UI
        env:
          BASE_PATH: /id-legacy
          ORIGIN: https://swarm.snaha.net
          PUBLIC_APP_DOMAIN: https://swarm.snaha.net/demo-legacy
          PUBLIC_ID_DOMAIN: https://swarm.snaha.net/id-legacy
        run: pnpm --filter swarm-identity build

      - name: Create 404.html for SPA routing
        run: cp swarm-ui/build/index.html swarm-ui/build/404.html

      - name: Upload legacy identity UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: id-legacy-build-main
          path: swarm-ui/build
          retention-days: 1

  # Build demo at /demo, pointed at the new UI (/id).
  build-demo:
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.demo == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-main
          path: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo
        env:
          BASE_PATH: /demo
          PUBLIC_ID_DOMAIN: https://swarm.snaha.net/id
        run: pnpm --filter @swarm-id/demo build

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build-main
          path: demo/build
          retention-days: 1

  # Build demo at /demo-legacy, pointed at the legacy UI (/id-legacy).
  build-demo-legacy:
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.demo == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-main
          path: .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build legacy demo
        env:
          BASE_PATH: /demo-legacy
          PUBLIC_ID_DOMAIN: https://swarm.snaha.net/id-legacy
        run: pnpm --filter @swarm-id/demo build

      - name: Upload legacy demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-legacy-build-main
          path: demo/build
          retention-days: 1

  # Build docs at /docs, with a root redirect landing page.
  build-docs:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs-site
        run: pnpm astro build --base /docs/

      - name: Create root redirect
        run: |
          mkdir -p docs-site/dist-root/docs
          cp -r docs-site/dist/* docs-site/dist-root/docs/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=/docs/"></head></html>' > docs-site/dist-root/index.html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-main
          path: docs-site/dist-root
          retention-days: 1

  # Assemble all built apps and publish to GitHub Pages in a single push.
  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-id, build-id-legacy, build-demo, build-demo-legacy, build-docs]
    if: |
      always() &&
      (needs.build-id.result == 'success' || needs.build-id.result == 'skipped') &&
      (needs.build-id-legacy.result == 'success' || needs.build-id-legacy.result == 'skipped') &&
      (needs.build-demo.result == 'success' || needs.build-demo.result == 'skipped') &&
      (needs.build-demo-legacy.result == 'success' || needs.build-demo-legacy.result == 'skipped') &&
      (needs.build-docs.result == 'success' || needs.build-docs.result == 'skipped') &&
      (needs.build-id.result == 'success' || needs.build-id-legacy.result == 'success' || needs.build-demo.result == 'success' || needs.build-demo-legacy.result == 'success' || needs.build-docs.result == 'success')
    steps:
      - name: Create build directory structure
        run: mkdir -p build-root

      - name: Download identity UI artifact
        if: needs.build-id.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: id-build-main
          path: build-root/id

      - name: Download legacy identity UI artifact
        if: needs.build-id-legacy.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: id-legacy-build-main
          path: build-root/id-legacy

      - name: Download demo artifact
        if: needs.build-demo.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: demo-build-main
          path: build-root/demo

      - name: Download legacy demo artifact
        if: needs.build-demo-legacy.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: demo-legacy-build-main
          path: build-root/demo-legacy

      # Docs artifact already contains docs/ plus the root redirect index.html.
      - name: Download docs artifact
        if: needs.build-docs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: docs-build-main
          path: build-root

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build-root
          cname: swarm.snaha.net
          keep_files: true
