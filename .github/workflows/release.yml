name: Release & Publish

# Both release and publish live in one file so that npm's OIDC trusted publisher
# always sees the same workflow_ref. A separate publish.yml called via workflow_call
# would cause the OIDC token to reference the *caller* (release.yml), failing auth.
#
# Triggers (all go through this single workflow):
#   1. Push to main (regular commit) → release-please creates/updates a release PR,
#      publish is skipped
#   2. Push to main (release PR merged) → release-please detects the merged PR,
#      creates a GitHub release + tag → the three-device suite runs against a
#      real cluster → publish runs and publishes to npm only if it passed
#   3. Manual workflow_dispatch → release-please and the suite are skipped,
#      and the package is built and published without them (the override for a
#      release whose suite run was judged and found wanting for reasons that
#      are not the release's). It still waits on the npm-publish environment.
#
# Only the publish job holds the OIDC token npm trusts, so it runs no
# dependency code: the build job installs, builds and packs, and publish
# uploads that tarball and nothing else.
on:
  push:
    branches:
      - main
  workflow_dispatch: # allows manual publish from the Actions tab

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  release-please:
    # Only run on push — skip on manual workflow_dispatch which is for publishing to npm only
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases and tags
      pull-requests: write # create/update release PRs
    outputs:
      release_created: ${{ steps.release.outputs['lib--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # The partition-lease scenarios in real browsers against a real cluster
  # (`three-devices.yml`), once a release exists and before it is published.
  # The tag is already cut by now; what a red run stops is the npm publish,
  # the step that cannot be taken back.
  three-devices:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/three-devices.yml
    permissions:
      contents: read

  build:
    needs: [release-please, three-devices]
    # Runs on manual dispatch OR when release-please created a release and the
    # suite passed. !failure() is required because GitHub Actions skips
    # dependent jobs when their dependency is skipped — without it,
    # workflow_dispatch would never reach this job's condition. Unlike
    # always(), !failure() still respects workflow cancellation and won't run
    # if release-please or the suite fails.
    if: |
      !failure() &&
      (github.event_name == 'workflow_dispatch' ||
      (needs.release-please.outputs.release_created == 'true' &&
      needs.three-devices.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @snaha/swarm-id build

      - name: Pack
        working-directory: lib
        run: npm pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    # Protection lives in the environment's settings, not here: it allows only
    # main, requires a reviewer and admits no admin bypass, and npm's trusted
    # publisher names it, so no other branch or workflow can publish.
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm OIDC trusted publishing (provenance)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # No cache: nothing restored from a cache runs beside the token. Node 24
      # bundles an npm new enough for OIDC publishing (11.5.1+), so none is
      # installed either.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish to npm
        run: npm publish ./*.tgz --provenance --access public
