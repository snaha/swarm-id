name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Build lib dependency
        working-directory: ./lib
        run: pnpm build

      - name: Code linting (lib)
        working-directory: ./lib
        run: pnpm lint

      - name: Typecheck (lib)
        working-directory: ./lib
        run: pnpm typecheck

      - name: Run lib unit tests
        working-directory: ./lib
        run: pnpm test

      - name: Build ui
        working-directory: ./ui
        run: pnpm build

      - name: Check the build (ui)
        working-directory: ./ui
        run: pnpm run check

      - name: Code linting (ui)
        working-directory: ./ui
        run: pnpm run lint

      - name: Check dependencies and unused files (ui)
        working-directory: ./ui
        run: pnpm knip

      - name: Run ui unit tests
        working-directory: ./ui
        run: pnpm test

      - name: Build demo
        working-directory: ./demo
        run: pnpm build

      - name: Check the build (demo)
        working-directory: ./demo
        run: pnpm run check

      - name: Code linting (demo)
        working-directory: ./demo
        run: pnpm run lint

      - name: Check dependencies and unused files (demo)
        working-directory: ./demo
        run: pnpm knip
