name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Build lib dependency
        working-directory: ./lib
        run: pnpm build

      - name: Code linting (lib)
        working-directory: ./lib
        run: pnpm lint

      - name: Typecheck (lib)
        working-directory: ./lib
        run: pnpm typecheck

      - name: Run lib unit tests
        working-directory: ./lib
        run: pnpm test

      # The package holding the PostageStamp ABI selectors, the EIP-7702 bundle
      # and the local solver protocol — previously in no workflow at all.
      - name: Code linting (multichain)
        working-directory: ./multichain
        run: pnpm lint

      - name: Typecheck (multichain)
        working-directory: ./multichain
        run: pnpm typecheck

      - name: Run multichain unit tests
        working-directory: ./multichain
        run: pnpm test

      # The account-bus signaling and relay service (docs/Account-Bus.md).
      - name: Code linting (signaling)
        working-directory: ./signaling
        run: pnpm lint

      - name: Typecheck (signaling)
        working-directory: ./signaling
        run: pnpm typecheck

      - name: Run signaling unit tests
        working-directory: ./signaling
        run: pnpm test

      - name: Build ui
        working-directory: ./ui
        run: pnpm build

      # The build swaps the dev funding seam and the `/dev` route for inert
      # stubs (`stubDevOnlyModules` in `vite.config.ts`), and that is only worth
      # anything if the swaps actually hold. Reading the source cannot tell
      # you: a static import survives a dead `import.meta.env.DEV` branch. Only
      # the built assets know, and no chunk may carry any of these markers.
      #
      # Four markers, because `anvil_setBalance` alone is not on the leak path:
      # it reaches the bundle through `mintSourceEth`, which `resolveLocalRail`
      # never calls, so it tree-shakes away while the rail itself ships. The
      # source chain's URL and the local solver's address cannot — the rail is
      # built out of them. The fourth is a label of the `/dev` page itself,
      # which imports the dev tree directly: the route swap is what keeps it
      # out, and a leak of the page would carry the label whether or not the
      # rail came with it. None of the four collides with anything else in the
      # bundle (viem's chain registry does carry a bare `31337`, hence the port
      # being matched as part of the URL).
      #
      # Each canary is checked to still exist before it is searched for: the
      # search is a negative assertion, so a renamed helper or a rotated key
      # would leave it green forever while guarding nothing.
      #
      # Checked against the SOURCE, not the bundle — the solver address reaches
      # no chunk at all (`/dev` imports only the faucet half of the rail), and
      # absent is its correct state while misspelled is not. Anchored on the
      # declaration, so a comment naming a renamed helper cannot keep a canary
      # looking alive.
      - name: Check the dev tree stayed out of the bundle (ui)
        working-directory: ./ui
        run: |
          stale=0
          # $1 canary, $2 file, $3 the declaration that must still spell it.
          require_canary() {
            if ! grep -qF -- "$3" "$2"; then
              echo "::error::Bundle-guard canary '$1' is no longer spelled that way in $2 (looked for: $3). The leak search below would pass without ever being able to fail — update the canary and the declaration together."
              stale=1
            fi
          }
          require_canary 'anvil_setBalance' 'src/lib/dev/local-payment-rail.ts' "sourceRpc('anvil_setBalance'"
          require_canary 'localhost:31337' 'src/lib/dev/local-payment-rail.ts' "DEFAULT_SOURCE_RPC_URL = 'http://localhost:31337'"
          require_canary 'a0ee7a142d267c1f36714e4a8f75612f20a79720' '../multichain/src/local-solver-protocol.ts' 'LOCAL_SOLVER_ADDRESS = "0xa0ee7a142d267c1f36714e4a8f75612f20a79720"'
          require_canary 'Create drive to test with' 'src/routes/dev/+page.svelte' 'Create drive to test with'
          if [ "$stale" -ne 0 ]; then
            exit 1
          fi
          canaries='anvil_setBalance|localhost:31337|a0ee7a142d267c1f36714e4a8f75612f20a79720|Create drive to test with'
          leaked=$(grep -rlE "$canaries" build || true)
          if [ -n "$leaked" ]; then
            echo "::error::Dev-only code reached the shipped bundle:"
            echo "$leaked"
            echo "Production code must reach dev helpers only through \$lib/payment/dev-funding, and the /dev route ships only as its 404 stub — both swapped in by stubDevOnlyModules (vite.config.ts)."
            exit 1
          fi

      - name: Check the build (ui)
        working-directory: ./ui
        run: pnpm run check

      - name: Code linting (ui)
        working-directory: ./ui
        run: pnpm run lint

      - name: Check dependencies and unused files (ui)
        working-directory: ./ui
        run: pnpm knip

      - name: Run ui unit tests
        working-directory: ./ui
        run: pnpm test

      - name: Build demo
        working-directory: ./demo
        run: pnpm build

      - name: Check the build (demo)
        working-directory: ./demo
        run: pnpm run check

      - name: Code linting (demo)
        working-directory: ./demo
        run: pnpm run lint

      - name: Check dependencies and unused files (demo)
        working-directory: ./demo
        run: pnpm knip

      - name: Run demo unit tests
        working-directory: ./demo
        run: pnpm test

  # On-chain tests against the baked snapshot. Its own job so it can start a
  # chain without slowing the checks above, and because a failure here means
  # something different: the contract calls, not the code around them.
  fork-tests:
    name: On-chain (fork) tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the local chain
        run: pnpm dev:chain:detach

      # The suite skips itself when no chain answers, so without this a slow
      # start would look like a pass.
      - name: Wait for the local chain
        run: |
          for _ in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://localhost:9545 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The local chain never answered on :9545 — the fork suite would have skipped silently."
          pnpm -s dev:cluster logs blockchain --tail 100 || true
          exit 1

      - name: Run the fork suite
        run: pnpm test:fork

      - name: Stop the local chain
        if: always()
        run: pnpm dev:chain:stop

  # Talks to Relay's real quote API — the only thing that can catch our request
  # or response mapping drifting from theirs, and it quotes every (chain, token)
  # pair the payment screen offers. A read, no wallet, no money. Offline it
  # skips; here it does not — an unreachable Relay fails this job on purpose,
  # because that is worth knowing about. The job is not required, so it reports
  # the outage without blocking a merge.
  live-tests:
    name: Live service contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the live contract suite
        working-directory: ./ui
        run: pnpm test:live
