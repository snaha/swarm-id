<html>
  <head>
    <meta charset="utf-8" />
    <title>Safari probe: identity iframe</title>
    <style>
      body {
        font:
          14px -apple-system,
          system-ui,
          sans-serif;
        margin: 12px;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        background: #f6f6f6;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <b>Identity iframe: <code id="origin"></code></b>
    <p>Driven by the embedding page over <code>postMessage</code>; nothing to click here.</p>
    <pre id="out"></pre>
    <script src="common.js"></script>
    <script>
      const VAULT_KEY = 'safari-probe-vault'
      document.getElementById('origin').textContent = location.origin

      async function serviceWorkerState() {
        if (!('serviceWorker' in navigator)) return { supported: false }
        try {
          const registration = await navigator.serviceWorker.register('sw.js', { scope: './' })
          return {
            supported: true,
            registered: true,
            active: !!registration.active,
            controlled: !!navigator.serviceWorker.controller,
          }
        } catch (e) {
          return { supported: true, registered: false, ...errorInfo(e) }
        }
      }

      async function status(test) {
        report(test, {
          ok: true,
          online: navigator.onLine,
          hasStorageAccess: await storageAccess(),
          hasFocus: document.hasFocus(),
          visibility: document.visibilityState,
          vaultFingerprint: JSON.parse(localStorage.getItem(VAULT_KEY) ?? '{}').fingerprint,
          serviceWorker: await serviceWorkerState(),
        })
      }

      async function mint(password) {
        try {
          const t0 = performance.now()
          const entropy = crypto.getRandomValues(new Uint8Array(16)) // 12-word seed
          const salt = crypto.getRandomValues(new Uint8Array(32))
          const key = await passwordKey(password, salt)
          const encryptedSeed = await encrypt(entropy, key)
          const roundTrip = hex(await decrypt(encryptedSeed, key)) === hex(entropy)
          const fingerprint = hex(await crypto.subtle.digest('SHA-256', entropy)).slice(0, 16)
          const vault = {
            access: { type: 'password', kdfSalt: hex(salt), kdfIterations: PBKDF2_ITERATIONS },
            encryptedSeed,
            fingerprint,
          }
          localStorage.setItem(VAULT_KEY, JSON.stringify(vault))
          const persisted = JSON.parse(localStorage.getItem(VAULT_KEY)).fingerprint === fingerprint
          report('mint-password-vault', {
            ok: roundTrip && persisted,
            online: navigator.onLine,
            controlledByServiceWorker: !!navigator.serviceWorker?.controller,
            roundTrip,
            persisted,
            fingerprint,
            ms: Math.round(performance.now() - t0),
          })
        } catch (e) {
          report('mint-password-vault', errorInfo(e))
        }
      }

      const focusInfo = () => ({
        hasFocus: document.hasFocus(),
        visibility: document.visibilityState,
      })

      let popup
      const commands = {
        status: () => status('frame-status'),
        mint: (data) => mint(data.password),
        'passkey-create': async () => {
          const before = focusInfo()
          try {
            report('iframe-passkey-create', {
              ...(await createPasskey('safari-probe-iframe-' + Date.now())),
              ...before,
            })
          } catch (e) {
            report('iframe-passkey-create', { ...errorInfo(e), ...before })
          }
        },
        'passkey-get': async () => {
          const before = focusInfo()
          try {
            // Discoverable, so any passkey for this host can be picked.
            report('iframe-passkey-get', { ...(await getPasskey(undefined)), ...before })
          } catch (e) {
            report('iframe-passkey-get', { ...errorInfo(e), ...before })
          }
        },
        claim: () => {
          if (!localStorage.getItem(VAULT_KEY)) {
            report('claim-open', { ok: false, errorMessage: 'sign up first' })
            return
          }
          popup = window.open(
            new URL('claim.html', location.href),
            'safari-probe-claim',
            'width=520,height=640',
          )
          report('claim-open', { ok: !!popup, popupReturned: !!popup })
        },
      }

      window.addEventListener('message', (event) => {
        if (event.source === window.parent && event.data?.type === 'probe-cmd') {
          commands[event.data.cmd]?.(event.data)
          return
        }
        if (event.origin !== location.origin || event.source !== popup) return
        if (event.data?.type === 'probe-report') {
          window.parent.postMessage(event.data, '*')
        }
        if (event.data?.type === 'claim-ready') {
          popup.postMessage(
            { type: 'claim-vault', vault: localStorage.getItem(VAULT_KEY) },
            location.origin,
          )
          report('claim-sent', { ok: true })
        }
        if (event.data?.type === 'claim-done') {
          report('claim-ack', { ok: !!event.data.ok, popupResult: event.data })
        }
      })

      localStorage.setItem('safari-probe-iframe-wrote', new Date().toISOString())
      status('frame-load')
    </script>
  </body>
</html>
