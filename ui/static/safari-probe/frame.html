<html>
  <head>
    <meta charset="utf-8" />
    <title>Safari probe: identity iframe</title>
    <style>
      body {
        font:
          14px -apple-system,
          system-ui,
          sans-serif;
        margin: 12px;
      }
      button {
        display: block;
        margin: 8px 0;
        padding: 6px 10px;
        font-size: 14px;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        background: #f6f6f6;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <b>Identity iframe: <code id="origin"></code></b>
    <div>Password: <input id="pw" value="probe-password" /></div>
    <button id="b1">1. Mint seed + password vault (invisible signup)</button>
    <button id="b2">2. Create passkey inside this iframe (PRF)</button>
    <button id="b3">3. Sign in with a passkey inside this iframe (PRF)</button>
    <button id="b4">4. Claim: hand the vault to a Swarm ID popup</button>
    <pre id="out"></pre>
    <script src="common.js"></script>
    <script>
      const VAULT_KEY = 'safari-probe-vault'
      document.getElementById('origin').textContent = location.origin
      ;(async () => {
        localStorage.setItem('safari-probe-iframe-wrote', new Date().toISOString())
        report('frame-load', {
          ok: true,
          hasStorageAccess: await storageAccess(),
          existingVault: !!localStorage.getItem(VAULT_KEY),
          seesFirstPartyMarker: !!localStorage.getItem('safari-probe-first-party-wrote'),
        })
      })()

      document.getElementById('b1').onclick = async () => {
        try {
          const t0 = performance.now()
          const entropy = crypto.getRandomValues(new Uint8Array(16)) // 12-word seed
          const salt = crypto.getRandomValues(new Uint8Array(32))
          const key = await passwordKey(document.getElementById('pw').value, salt)
          const encryptedSeed = await encrypt(entropy, key)
          const roundTrip = hex(await decrypt(encryptedSeed, key)) === hex(entropy)
          const fingerprint = hex(await crypto.subtle.digest('SHA-256', entropy)).slice(0, 16)
          const vault = {
            access: { type: 'password', kdfSalt: hex(salt), kdfIterations: PBKDF2_ITERATIONS },
            encryptedSeed,
            fingerprint,
          }
          localStorage.setItem(VAULT_KEY, JSON.stringify(vault))
          const persisted = JSON.parse(localStorage.getItem(VAULT_KEY)).fingerprint === fingerprint
          report('mint-password-vault', {
            ok: roundTrip && persisted,
            roundTrip,
            persisted,
            fingerprint,
            ms: Math.round(performance.now() - t0),
          })
        } catch (e) {
          report('mint-password-vault', errorInfo(e))
        }
      }

      document.getElementById('b2').onclick = async () => {
        try {
          report('iframe-passkey-create', await createPasskey('safari-probe-iframe-' + Date.now()))
        } catch (e) {
          report('iframe-passkey-create', errorInfo(e))
        }
      }

      document.getElementById('b3').onclick = async () => {
        try {
          // Discoverable, so the passkey made first-party (control A) can be picked.
          report('iframe-passkey-get', await getPasskey(undefined))
        } catch (e) {
          report('iframe-passkey-get', errorInfo(e))
        }
      }

      let popup
      document.getElementById('b4').onclick = () => {
        if (!localStorage.getItem(VAULT_KEY)) {
          report('claim-open', { ok: false, errorMessage: 'run step 1 first' })
          return
        }
        popup = window.open(
          new URL('claim.html', location.href),
          'safari-probe-claim',
          'width=520,height=640',
        )
        report('claim-open', { ok: !!popup, popupReturned: !!popup })
      }

      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== popup) return
        if (event.data?.type === 'probe-report') {
          window.parent.postMessage(event.data, '*')
        }
        if (event.data?.type === 'claim-ready') {
          popup.postMessage(
            { type: 'claim-vault', vault: localStorage.getItem(VAULT_KEY) },
            location.origin,
          )
          report('claim-sent', { ok: true })
        }
        if (event.data?.type === 'claim-done') {
          report('claim-ack', { ok: !!event.data.ok, popupResult: event.data })
        }
      })
    </script>
  </body>
</html>
