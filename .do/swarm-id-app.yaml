name: swarm-id
region: fra

# Domain configuration
domains:
  - domain: swarm-id.snaha.net
    type: PRIMARY

# Static site for swarm-id.snaha.net
# Serves the new SvelteKit identity UI (ui/), including the proxy/connect pages
static_sites:
  - name: id-app
    # GitHub auto-deploy configuration
    # Note: deploy_on_push disabled - deployments managed by GitHub Actions workflow
    github:
      repo: snaha/swarm-id
      branch: main
      deploy_on_push: false

    source_dir: /
    output_dir: ui/build

    # Build using monorepo scripts.
    # `corepack enable` reads the version from package.json's packageManager field.
    # The lib must build first: the UI resolves @snaha/swarm-id from lib/dist.
    build_command: corepack enable && pnpm install --frozen-lockfile && pnpm build:lib && pnpm build:ui

    # SPA routing - all routes go to index.html
    catchall_document: index.html

    # CORS headers for cross-origin communication with swarm-demo
    cors:
      allow_origins:
        - exact: https://swarm-demo.snaha.net
      allow_methods:
        - GET
        - POST
        - OPTIONS
      allow_headers:
        - Content-Type
      allow_credentials: true
      max_age: '600s'

# Environment variables
envs:
  - key: NODE_VERSION
    value: '24'

  - key: NODE_ENV
    value: production

  - key: CI
    value: 'true'

# Deployment alerts
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
