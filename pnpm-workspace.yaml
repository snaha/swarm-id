packages:
  - 'lib'
  - 'multichain'
  - 'signaling'
  - 'demo'
  - 'ui'
  - 'docs-site'
  - 'eslint-rules'

# pnpm 11 reads non-auth settings from this file, not .npmrc.
autoInstallPeers: false
engineStrict: true

# Every dependency is pinned to an exact version (AGENTS.md, "Dependency versions"): `pnpm add`
# writes `1.2.3`, never `^1.2.3`, so a compromised release cannot slip in through a range.
savePrefix: ''

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  # es5-ext has a noisy postinstall (sponsorship message); not required to build.
  es5-ext: false
  # @reown/appkit (via @web3-onboard/walletconnect) postinstalls a script that only
  # warns about mismatched @reown/* versions; nothing is built.
  '@reown/appkit': false

# pnpm holds new releases back for a cooling-off period as a supply-chain guard,
# and 0.3.0 was published the same day this landed. It is ours (snaha/bee-compose)
# and a devDependency that never ships. Delete once the release has aged out.
minimumReleaseAgeExclude:
  - '@snaha/bee-compose@0.3.0'

# Security fixes for transitive dependencies (`pnpm audit --prod`), each the
# newest release at least a week old that clears the advisories. An exact target
# also holds back every later release, security ones included, so each audit
# pass revisits the whole block: raise an entry that has a newer fix, delete one
# whose parents have caught up. Not overridden, because no
# fix exists in the major they need: zod 3 (@coinbase/cdp-sdk, @reown/appkit),
# svelte 3 and esbuild 0.19 (@web3-onboard/core, built against them), deepmerge
# (no fixed release published).
overrides:
  axios@^1: 1.21.0
  # bnc-sdk only calls SHA1, so the PBKDF2 flaw is unreachable; 2.x keeps SHA1
  # on the default export, which is all it imports.
  crypto-es@^1: 2.1.0
  esbuild@~0.28: 0.28.2
  follow-redirects@^1: 1.16.2
  joi@^17: 17.13.9
  nanoid@^3: 3.3.20
  # No fix in 4.x; 5 has the same API.
  nanoid@^4: 5.1.16
  picomatch@^2: 2.3.2
  ws@^8: 8.22.1
  # Scoped: a bare zod@^4 also rewrites abitype's zod peer range.
  '@ethersphere/bee-js>zod': 4.6.7
  # Dev tooling only (`pnpm audit`, not --prod), same rule. Not overridden:
  # vite 7 and svelte 5.48 (pinned monorepo toolchain, bumped as one change),
  # minimatch 10 and cookie 0.6 (fix only in the next major), @sveltejs/kit
  # (fix only in 3.x).
  '@humanfs/node@^0.16': 0.16.8
  brace-expansion@^1: 1.1.21
  brace-expansion@^2: 2.1.7
  brace-expansion@^5: 5.0.12
  compression@^1: 1.8.2
  devalue@^5: 5.9.4
  fflate@^0.8: 0.8.3
  flatted@^3: 3.4.4
  js-yaml@^4: 4.3.2
  minimatch@^9: 9.0.9
  picomatch@^4: 4.0.7
  postcss@^8: 8.5.32
  postcss-selector-parser@^6: 6.1.5
  postcss-selector-parser@^7: 7.1.7
  rollup@^4: 4.67.4
  smol-toml@^1: 1.9.1
  source-map-js@^1: 1.2.2
  tar@^7: 7.5.22
  yaml@^1: 1.10.3
