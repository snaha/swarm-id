packages:
  - 'lib'
  - 'multichain'
  - 'signaling'
  - 'demo'
  - 'ui'
  - 'docs-site'
  - 'eslint-rules'

# pnpm 11 reads non-auth settings from this file, not .npmrc.
autoInstallPeers: false
engineStrict: true

# Every dependency is pinned to an exact version (AGENTS.md, "Dependency versions"): `pnpm add`
# writes `1.2.3`, never `^1.2.3`, so a compromised release cannot slip in through a range.
savePrefix: ''

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  # es5-ext has a noisy postinstall (sponsorship message); not required to build.
  es5-ext: false
  # @reown/appkit (via @web3-onboard/walletconnect) postinstalls a script that only
  # warns about mismatched @reown/* versions; nothing is built.
  '@reown/appkit': false

# pnpm holds new releases back for a cooling-off period as a supply-chain guard,
# and 0.3.0 was published the same day this landed. It is ours (snaha/bee-compose)
# and a devDependency that never ships. Delete once the release has aged out.
minimumReleaseAgeExclude:
  - '@snaha/bee-compose@0.3.0'

# Security fixes for transitive dependencies (`pnpm audit --prod`), each the
# newest release at least a week old that clears the advisories. An exact target
# also holds back every later release, security ones included, so each audit
# pass revisits the whole block: raise an entry that has a newer fix, delete one
# whose parents have caught up. Not overridden, because no
# fix exists in the major they need: zod 3 (@coinbase/cdp-sdk, @reown/appkit),
# svelte 3 and esbuild 0.19 (@web3-onboard/core, built against them), deepmerge
# (no fixed release published).
overrides:
  axios@^1: 1.21.0
  # bnc-sdk only calls SHA1, so the PBKDF2 flaw is unreachable; 2.x keeps SHA1
  # on the default export, which is all it imports.
  crypto-es@^1: 2.1.0
  esbuild@~0.28: 0.28.2
  follow-redirects@^1: 1.16.2
  joi@^17: 17.13.9
  nanoid@^3: 3.3.20
  # No fix in 4.x; 5 has the same API.
  nanoid@^4: 5.1.16
  picomatch@^2: 2.3.2
  ws@^8: 8.22.1
  # Scoped: a bare zod@^4 also rewrites abitype's zod peer range.
  '@ethersphere/bee-js>zod': 4.6.7
  # Dev tooling only (`pnpm audit`, not --prod), same rule. Not overridden:
  # vite 7 (pinned monorepo toolchain, bumped as one change),
  # minimatch 10 and cookie 0.6 (fix only in the next major), @sveltejs/kit
  # (fix only in 3.x).
  '@humanfs/node@^0.16': 0.16.8
  brace-expansion@^1: 1.1.21
  brace-expansion@^2: 2.1.7
  brace-expansion@^5: 5.0.12
  compression@^1: 1.8.2
  devalue@^5: 5.9.4
  fflate@^0.8: 0.8.3
  flatted@^3: 3.4.4
  js-yaml@^4: 4.3.2
  minimatch@^9: 9.0.9
  picomatch@^4: 4.0.7
  postcss@^8: 8.5.32
  postcss-selector-parser@^6: 6.1.5
  postcss-selector-parser@^7: 7.1.7
  rollup@^4: 4.67.4
  smol-toml@^1: 1.9.1
  source-map-js@^1: 1.2.2
  tar@^7: 7.5.22
  yaml@^1: 1.10.3

# What `pnpm audit` still reports once the overrides above are applied, each
# accepted for the reason beside it. The audit gates the npm publish and both
# production deploys (.github/workflows/audit.yml), so an advisory missing from
# this list stops them: override it above, or add it here with why it does not
# reach what ships. Each group names the issue that clears it, and the audit
# job fails on an entry that is no longer reported, so a fix taken deletes its
# entries in the same PR.
auditConfig:
  ignoreGhsas:
    # Inside @web3-onboard/core and @relayprotocol/relay-sdk, with no fix in
    # the major they need (see above): zod 3, deepmerge, esbuild 0.19. #1022
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-gcqx-w48m-w2h4
    - GHSA-67mh-4wv8-2f99
    # The svelte 3 runtime compiled into @web3-onboard/core, which has no fixed
    # release in its major. The apps' own svelte is past every one of these.
    # All but the first and last are server-side rendering, which the wallet
    # modal never does; the last (DOM clobbering) needs attributes spread onto
    # a form, and the modal renders no form. #1022
    - GHSA-8266-84wp-wv5c
    - GHSA-crpf-4hrx-3jrp
    - GHSA-f7gr-6p89-r883
    - GHSA-m56q-vw4c-c2cp
    - GHSA-phwv-c562-gvmh
    - GHSA-pr6f-5x2q-rwfp
    - GHSA-rcqx-6q8c-2c42
    # Vite's dev server and its launch-editor. Neither is deployed. #1020
    - GHSA-587h-7wmj-h5pm
    - GHSA-p9ff-h696-f583
    - GHSA-v2wj-q39q-566r
    - GHSA-9jrq-w75r-8gcw
    - GHSA-4w7w-66w2-5vf9
    - GHSA-698v-4r3x-3vcv
    - GHSA-fx2h-pf6j-xcff
    - GHSA-r825-w8mm-5pxw
    - GHSA-rq7h-c2jc-7f22
    - GHSA-v6wh-96g9-6wx3
    # SvelteKit, fixed only in 3.x: `setHeaders` on a prerendered page and
    # `use:enhance` form actions, neither of which the apps use. cookie 0.6
    # comes with it and parses no cookie here. #1021
    - GHSA-27mw-82g8-phjj
    - GHSA-pfhg-q3qv-9q6r
    - GHSA-pxg6-pf52-xh8x
    # minimatch 10 under eslint and prettier plugins: lint tooling, fed only
    # this repo's own globs. #1023
    - GHSA-g3hv-75wg-m249
